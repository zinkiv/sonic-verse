[project]
name = "sonicverse"
version = "0.1.0"
description = "Personal Digital Music Universe - Music metadata management and enhancement platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SonicVerse Team" }
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mutagen>=1.47.0",
    "musicbrainzngs>=0.7.1",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.18.0",
    "asyncpg>=0.28.0",
    "httpx>=0.24.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sonicverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
