server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve upstream at request time so nginx
    # does not crash if the backend hostname is briefly unavailable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "sonicverse:8000";

    # API proxy to backend
    location /api/ {
        client_max_body_size 200m;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cover images served by the backend.
    # ^~ beats the static-asset regex below; otherwise /covers/*.jpg is
    # treated as a local file under html/ and 404s.
    location ^~ /covers/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (hashed JS/CSS and any leftover icons).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
